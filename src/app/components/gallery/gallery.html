<main class="w-full min-h-screen p-4 md:p-8 flex justify-center">
  <div class="max-w-5xl mx-auto w-full flex flex-col gap-y-6">
    <header class="w-full text-center flex flex-col gap-6 items-center mb-16">
      <h1 class="text-3xl text-center mb-10 text-[#9d3b65]">La meva galeria d'imatges</h1>

      @if (selectedImageIds().size > 0) {
      <div role="toolbar" aria-label="Accions de selecció" class="flex justify-center gap-6">

        <button (click)="toggleAll()"
          class="btn-reflectant bg-[#9d3b65] hover:bg-[#752548] text-white font-bold py-2 px-4 rounded-xl flex items-center gap-2 transition-all">
          <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
          clip-rule="evenodd"
        />
      </svg>
          {{ selectedImageIds().size === images().length ? 'Deselecciona-ho tot' : 'Selecciona-ho tot' }}
        </button>

        <button (click)="deleteSelected()"
          class="btn-reflectant bg-[#9d3b65] hover:bg-[#752548] text-white font-bold py-2 px-4 rounded-lg shadow-lg flex items-center gap-2 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
              clip-rule="evenodd" />
          </svg>
          Esborrar seleccionades ({{ selectedImageIds().size }})
        </button>
      </div>
      }
    </header>

    <ul cdkDropList (cdkDropListDropped)="drop($event)" aria-label="Quadrícula de fotografies"
      class="grid gap-6 grid-cols-2 md:grid-cols-4 lg:grid-cols-5 auto-rows-[200px] justify-center">
      @for (img of images(); track img.id; let i = $index) {
      <li [ngClass]="{
            'lg:col-span-2 lg:row-span-2': i === 0,
            'col-span-1 row-span-1': i !== 0,
          }" [class.featured]="img.id === featuredImageID()"
        class="relative w-full h-full overflow-hidden rounded-xl shadow-lg border-2 border-gray-200 bg-white transition-all duration-300 cursor-move"
        cdkDrag>
        <app-image-item [image]="img" [isSelected]="selectedImageIds().has(img.id)"
          (selectImage)="toggleSelection(img.id)" (deleteImage)="removeImage($event)"
          [isFeatured]="img.id === featuredImageID()" class="block w-full h-full">
        </app-image-item>
      </li>
      }
    </ul>
  </div>
</main>
