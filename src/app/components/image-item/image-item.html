<figure
  (click)="onImageClick()"
  class="image-container group relative w-full h-full overflow-hidden rounded-xl transition-all cursor-pointer"
  [class.selected-border]="isSelected()"
  [class.featured]="isFeatured()"
  role="region"
  [attr.aria-label]="'Imatge de la galeria: ' + image().alt"
  [attr.aria-selected]="isSelected()"
>
  <img
    [ngSrc]="image().src"
    [alt]="image().alt"
    [priority]="isFeatured()"
    fill
    class="object-cover"
    [attr.aria-describedby]="isFeatured() ? 'featured-desc' : null"
  />

  @if (isSelected()) {
    <div class="absolute top-2 left-2 bg-blue-500 text-white p-1 rounded-full shadow-lg z-30">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  }

  <button
    (click)="onDeleteClick($event)"
    title="Esborrar aquesta imatge"
    type="button"
    class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full shadow-lg transition-opacity opacity-0 group-hover:opacity-100 z-20"
  >
    <span class="sr-only">Esborrar imatge</span>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path
        fill-rule="evenodd"
        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (isFeatured()) {
    <figcaption id="featured-desc" class="sr-only">
      Aquesta és la imatge destacada de la galeria
    </figcaption>
  }
</figure>
